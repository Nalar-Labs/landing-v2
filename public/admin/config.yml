backend:
  name: github
  repo: Nalar-Labs/landing-v2
  branch: main
  base_url: https://nalar-sveltia-cms-auth.garda4199.workers.dev

# Uploaded images land in the repo and are served by Vite from /images/...
media_folder: public/images/portfolio
public_folder: /images/portfolio

collections:
  - name: portfolio
    label: Portfolio
    folder: src/content/portfolio
    format: json
    extension: json
    create: true
    identifier_field: title
    summary: "{{title}} — {{client}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: client, label: Client, widget: string, required: false }
      - { name: summary, label: Summary, widget: text, hint: "One sentence shown on the card and at the top of the popup." }
      - { name: coverImage, label: Cover image, widget: image, required: false,
          hint: "Card image, and the poster frame shown before a video is played." }
      - { name: logo, label: Company logo, widget: image, required: false, hint: "Logo displayed in top-left corner of card" }
      - { name: video, label: Video URL, widget: string, required: false,
          pattern: ['^https?://(www\.|m\.)?(youtube(-nocookie)?\.com/(watch\?\S*v=|embed/|shorts/|live/)|youtu\.be/)[A-Za-z0-9_-]{11}(?![A-Za-z0-9_-])([?&#]\S*)?$|^https?://(www\.|player\.)?vimeo\.com/(\S*/)?(video/)?\d+(/[^?#\s]*)?([?#]\S*)?$', 'Must be a full YouTube or Vimeo link starting with https:// — paste exactly what the Share button gives you (youtu.be, watch, shorts, embed, live, or vimeo.com/<id>); extra parameters like ?si= or ?share= are fine'],
          hint: "Upload the video to YouTube or Vimeo first, then paste the full link (including https://) here. Do not upload video files — this repo only stores images." }
      - { name: gallery, label: Extra images, widget: list, required: false,
          field: { name: image, label: Image, widget: image },
          hint: "Shown after the video in the popup, swipeable with dots." }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: order, label: Order, widget: number, value_type: int, default: 0, hint: "Carousel position, lowest first. Keep unique." }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "Drafts are hidden from the site." }
      - { name: body, label: Body, widget: markdown, hint: "The popup page content. Headings, lists, links, and images all work." }
